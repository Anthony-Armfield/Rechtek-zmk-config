# Enable Sleep to save battery
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Stronger Bluetooth signal for busy office environments
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable battery reporting over Bluetooth
CONFIG_ZMK_BATTERY_REPORTING=y
# How often to report battery in seconds (60 seconds)
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=6

# Change the Bluetooth ID so Windows treats it as a brand new device
CONFIG_BT_DEVICE_NAME="Modern-Rek-V2"
# This forces the stack to generate a new identity
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n

# Change the hardware address type to bypass Windows ghost bonds
CONFIG_BT_PRIVACY=y
CONFIG_BT_RPA_TIMEOUT=600
